[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quinn-research"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
gpu = ["torch==2.9.1"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["quinn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["a100: requires a physical A100 and the GPU dependencies"]
